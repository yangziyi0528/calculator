name: Calculator CI

# Trigger rules: run on every push to main and on every pull request targeting main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Display name shown in the Actions tab; the matrix value is expanded here.
    name: Build & Test (JDK ${{ matrix.java }})
    # Runner environment: the latest Ubuntu image provided by GitHub.
    runs-on: ubuntu-latest

    # Bonus task (Task 4): build and test in parallel on two JDK versions.
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      # Step 1: fetch the repository source code into the runner workspace.
      - name: Checkout source code
        uses: actions/checkout@v5

      # Step 2: install the required JDK, matching the project's target release (17).
      #         'cache: maven' also enables caching of the local Maven repository.
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Step 3: compile all Java source files.
      - name: Compile source code
        run: mvn -B clean compile

      # Step 4: execute all JUnit 5 test cases from Lab 4.
      - name: Run unit tests
        run: mvn -B test

  # ------------------------------------------------------------------
  # Lab 6 (Task 5): containerization job.
  # It runs only after BOTH matrix test jobs above have passed, then
  # builds the Docker image from the Dockerfile. On pushes to main,
  # with Docker Hub secrets configured, it also tags and pushes the
  # image to Docker Hub automatically (advanced requirement).
  # ------------------------------------------------------------------
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build   # gate on the unit-test matrix job above

    steps:
      # Step 1: fetch the repository source code (includes the Dockerfile).
      - name: Checkout source code
        uses: actions/checkout@v5

      # Step 2: build the image exactly like a local "docker build".
      - name: Build Docker image
        run: docker build -t calculator:v1 .

      # Step 3: smoke-test the calculator inside the container (+ - * /).
      #         '*' is quoted so bash does not glob-expand it.
      - name: Smoke-test calculator in container
        run: |
          docker run --rm calculator:v1 2 + 2
          docker run --rm calculator:v1 10 - 4
          docker run --rm calculator:v1 6 '*' 7
          docker run --rm calculator:v1 10 / 4

      # Step 4 (advanced): auto-push to Docker Hub, but only when
      #   - the trigger is a push to the main branch, and
      #   - the two repository secrets are configured under
      #     Settings -> Secrets and variables -> Actions:
      #     DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (access token).
      # Without the secrets the job still passes; it just skips the push.
      - name: Check Docker Hub credentials
        id: hub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.hub.outputs.available == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image to Docker Hub
        if: steps.hub.outputs.available == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag calculator:v1 ${{ secrets.DOCKERHUB_USERNAME }}/calculator:lab6
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/calculator:lab6
