name: Calculator CI

# Trigger rules: run on every push to main and on every pull request targeting main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Display name shown in the Actions tab; the matrix value is expanded here.
    name: Build & Test (JDK ${{ matrix.java }})
    # Runner environment: the latest Ubuntu image provided by GitHub.
    runs-on: ubuntu-latest

    # Bonus task (Task 4): build and test in parallel on two JDK versions.
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      # Step 1: fetch the repository source code into the runner workspace.
      - name: Checkout source code
        uses: actions/checkout@v5

      # Step 2: install the required JDK, matching the project's target release (17).
      #         'cache: maven' also enables caching of the local Maven repository.
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Step 3: compile all Java source files.
      - name: Compile source code
        run: mvn -B clean compile

      # Step 4: execute all JUnit 5 test cases from Lab 4.
      - name: Run unit tests
        run: mvn -B test

  # ------------------------------------------------------------------
  # Lab 6 (Task 5) / Lab 7: containerization job.
  # It runs only after BOTH matrix test jobs above have passed, then
  # builds the backend image from backend/Dockerfile. Since Lab 7 the
  # calculator is an HTTP API service, so the smoke test starts the
  # container and calls the /api/eval endpoint with curl.
  # ------------------------------------------------------------------
  docker:
    name: Backend Image Build & API Smoke Test
    runs-on: ubuntu-latest
    needs: build   # gate on the unit-test matrix job above

    steps:
      # Step 1: fetch the repository source code (includes backend/).
      - name: Checkout source code
        uses: actions/checkout@v5

      # Step 2: build the backend image exactly like a local
      #         "docker build" from the backend directory.
      - name: Build backend image
        run: docker build -t calculator-backend:v1 ./backend

      # Step 3: start the API container and wait until the JVM is up
      #         (poll /api/health for at most 30 seconds), then call
      #         /api/eval for + - * /. '+' is sent as %2B so the
      #         URL decoder on the server keeps it as the plus sign.
      - name: Smoke-test calculator API in container
        run: |
          docker run -d --name api-test -p 8000:8000 calculator-backend:v1
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 1
          done
          echo "2 + 3   -> $(curl -fs 'http://127.0.0.1:8000/api/eval?a=2&op=%2B&b=3')"
          echo "10 - 4  -> $(curl -fs 'http://127.0.0.1:8000/api/eval?a=10&op=-&b=4')"
          echo "6 * 7   -> $(curl -fs 'http://127.0.0.1:8000/api/eval?a=6&op=*&b=7')"
          echo "10 / 4  -> $(curl -fs 'http://127.0.0.1:8000/api/eval?a=10&op=/&b=4')"
          docker rm -f api-test

  # ------------------------------------------------------------------
  # Lab 7 (Task 5): Compose validation job.
  # The CI environment does not keep the stack running; it only checks
  # that docker-compose.yml is syntactically valid and that BOTH
  # images can be built from their Dockerfiles. This prevents a broken
  # compose file or Dockerfile from ever reaching the main branch.
  # ------------------------------------------------------------------
  compose:
    name: Compose Build Validation
    runs-on: ubuntu-latest
    needs: build   # run after the unit-test matrix, parallel to docker

    steps:
      # Step 1: fetch the complete repository (compose file, backend/, web/).
      - name: Checkout source code
        uses: actions/checkout@v5

      # Step 2: parse and validate docker-compose.yml. A YAML syntax
      #         error or an invalid field fails this step immediately.
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # Step 3: build both service images (backend and web) from their
      #         local Dockerfiles, exactly like a local compose build.
      - name: docker compose build
        run: docker compose build
