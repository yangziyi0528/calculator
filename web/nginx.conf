# ==============================================================
# nginx site configuration for the Calculator WEB service (Lab 7)
# --------------------------------------------------------------
# Serves the static calculator page on port 80 and reverse-proxies
# every /api/ request to the BACKEND container.
#
# IMPORTANT: the proxy target is the Compose SERVICE NAME "backend",
# not localhost. Inside the Compose network Docker's embedded DNS
# resolves the name "backend" to the backend container's IP, so the
# web container reaches it without ever knowing that IP. Writing
# localhost here would make nginx try to connect to itself.
# ==============================================================

server {
    # The web container listens on port 80 (mapped to host 8080
    # by docker-compose: "ports: 8080:80").
    listen 80;
    server_name _;

    # Document root: where COPY put the static files in the image.
    root /usr/share/nginx/html;
    index index.html;

    # Static files: serve them straight from this container.
    location / {
        try_files $uri $uri/ =404;
    }

    # API calls: forward to the backend service over the Compose
    # network. With no URI part after the port, nginx passes the
    # original request URI through unchanged, so the backend sees
    # the same path /api/eval that the browser requested.
    # The JVM inside the backend container needs a moment to boot,
    # so retries and a connect/read timeout keep early requests
    # from failing hard while the backend is still starting.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
